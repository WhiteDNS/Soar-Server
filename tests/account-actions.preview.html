<!doctype html><html lang="fa" dir="rtl" data-theme="dark"><head><meta charset="utf-8"><title>Account actions — component states</title><link rel="stylesheet" href="/tokens.css"><link rel="stylesheet" href="/style.css"><link rel="stylesheet" href="/redesign.css"></head><body>
<!-- Non-production component preview. Uses the panel's actual tokens and styles. -->
<main><h1>منوی عملیات حساب — حالت‌های کنترل</h1><table><tbody>
<tr><th>Default</th><td class="row-actions"><button class="account-actions-trigger">بیشتر ⌄</button></td></tr>
<tr><th>Hover</th><td class="row-actions"><button class="account-actions-trigger is-hover">بیشتر ⌄</button></td></tr>
<tr><th>Focus</th><td class="row-actions"><button class="account-actions-trigger is-focus">بیشتر ⌄</button></td></tr>
