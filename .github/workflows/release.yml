name: Test and release server
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Check out the pinned engine for module verification
        uses: actions/checkout@v4
        with:
          repository: WhiteDNS/CottenDNS
          ref: 7db7b73658c791cce62300d29647e4d369d6e1e4
          path: .engine-source/CottenDNS
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.1'
          cache-dependency-path: go.sum
      - name: Prepare the verified patched engine workspace
        run: |
          GOWORK=off go mod download
          python3 scripts/prepare_panel_engines.py --workspace .engine-source/patched.go.work
          echo "GOWORK=$GITHUB_WORKSPACE/.engine-source/patched.go.work" >> "$GITHUB_ENV"
      - name: Verify installer, bootstrap and diagnostics
        run: |
          bash -n install.sh setup.sh
          bash tests/installer_test.sh
          bash tests/bootstrap_test.sh
          go mod verify
          go test ./... -count=1 -timeout 240s
          go vet ./...
      - name: Build release bundle
        run: |
          python3 scripts/build_bundle.py
          bash dist/soar-server-setup-0.1.3-linux-amd64/install.sh --check-bundle
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            test "$GITHUB_REF_NAME" = "v$(sed -n 's/^SETUP_RELEASE=//p' setup.sh)"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: soar-server-linux-amd64
          path: |
            dist/*.tar.gz
            dist/*.sha256
          if-no-files-found: error
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: verify
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: soar-server-linux-amd64
          path: dist
      - name: Publish tested bundle
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --title "WhiteDNS Soar Server $GITHUB_REF_NAME" --notes-file RELEASE-NOTES.md
