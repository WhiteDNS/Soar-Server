name: Build and release WhiteDNS
on:
  workflow_dispatch:
    inputs:
      target:
        description: Product to build and release from main
        type: choice
        options: [panel, standalone]
        default: panel
        required: true
permissions:
  contents: read
concurrency:
  group: whitedns-manual-release
  cancel-in-progress: false
jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      build: ${{ steps.plan.outputs.build }}
      version: ${{ steps.plan.outputs.version }}
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check the version before allocating build runners
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TARGET: ${{ inputs.target }}
        run: python3 scripts/publish_release.py --plan
  verify:
    needs: plan
    if: needs.plan.outputs.build == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Check release version consistency
        run: |
          python3 scripts/build_panel_bundle.py --print-version
          python3 -m unittest discover -s tests -p 'panel_release*_test.py'
      - name: Check out the exact Cotten engine source
        uses: actions/checkout@v4
        with:
          repository: WhiteDNS/CottenDNS
          ref: 7db7b73658c791cce62300d29647e4d369d6e1e4
          path: .engine-source/CottenDNS
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.1'
          cache-dependency-path: go.sum
      - name: Prepare the verified patched engine workspace
        run: |
          GOWORK=off go mod download
          python3 scripts/prepare_panel_engines.py --workspace .engine-source/patched.go.work
          echo "GOWORK=$GITHUB_WORKSPACE/.engine-source/patched.go.work" >> "$GITHUB_ENV"
      - name: Verify the release binaries
        run: go build -mod=readonly ./cmd/soar-panel ./cmd/soar-panel-ops ./cmd/soar-check
      - name: Build the pinned native Cotten test client
        run: |
          COTTEN_SOURCE=$(go list -m -f '{{.Dir}}' cottendns-go)
          (cd "$COTTEN_SOURCE" && go build -mod=readonly -o "$RUNNER_TEMP/cotten-client" ./cmd/client)
          echo "PANEL_COTTEN_CLIENT=$RUNNER_TEMP/cotten-client" >> "$GITHUB_ENV"
      - name: Verify MasterDNS startup and settings restart races
        run: go test -race ./internal/panel -run 'TestMasterDNS|TestSettingsSaveRestarts' -count=3 -timeout 180s
      - name: Verify pinned engine dependencies and cleanup
        run: |
          (cd .engine-source/CottenDNS && go test ./... -count=1 -timeout 240s && go vet ./...)
          (cd .engine-source/MasterDnsVPN && go test ./... -count=1 -timeout 240s && go test ./internal/udpserver -run '^TestCleanupClosedSessionClosesStreamsAndClearsQueues$|^TestFinalizedStreamRejectsLatePackets$' -count=1000 -timeout 90s && go test -race ./internal/udpserver -run 'TestEmbedded|TestCleanupClosedSessionClosesStreamsAndClearsQueues|TestFinalizedStreamRejectsLatePackets' -count=10 -timeout 90s && go vet ./...)
      - name: Verify panel modules and behavior
        run: |
          go mod verify
          go test ./... -count=1 -timeout 180s
          # The expanded Telegram restore/model-discovery suite adds bcrypt-backed
          # admin fixtures; slower runners need room to finish every race check.
          go test -race ./internal/panel ./internal/panelops -count=1 -timeout 1800s
          go vet ./...
      - name: Verify installers and bootstrap
        run: |
          bash tests/installer_test.sh
          bash tests/bootstrap_test.sh
          bash -n install.sh setup.sh
          bash tests/panel_installer_test.sh
          bash tests/panel_bootstrap_test.sh
          bash tests/panel_menu_test.sh
          bash tests/panel_security_test.sh
      - name: Build offline Linux bundle
        if: inputs.target == 'panel'
        id: bundle
        run: |
          version=$(python3 scripts/build_panel_bundle.py --print-version)
          python3 scripts/build_panel_bundle.py --arch "${{ matrix.arch }}"
          directory="dist/soar-panel-$version-linux-${{ matrix.arch }}"
          bash "$directory/panel-install.sh" --check-bundle
          python3 tests/panel_bundle_test.py --bundle "$directory" --version "$version"
          echo "directory=$directory" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        if: inputs.target == 'panel'
        with:
          node-version: '24'
      - name: Install isolated browser test tools
        if: inputs.target == 'panel'
        run: |
          npm install --prefix "$RUNNER_TEMP/panel-tools" --ignore-scripts --no-audit --no-fund playwright@1.58.2
          node "$RUNNER_TEMP/panel-tools/node_modules/playwright/cli.js" install --with-deps chromium
      - name: Test browser workflows and responsive layout
        if: inputs.target == 'panel'
        env:
          PANEL_BINARY: ${{ github.workspace }}/${{ steps.bundle.outputs.directory }}/bin/linux-${{ matrix.arch }}/soar-panel
          PANEL_PLAYWRIGHT: ${{ runner.temp }}/panel-tools/node_modules/playwright
          PANEL_SCREENSHOTS: ${{ runner.temp }}/panel-screenshots
        run: |
          node tests/panel-ui.cjs
          node tests/panel-limits-ui.cjs
      - uses: actions/upload-artifact@v4
        if: inputs.target == 'panel'
        with:
          name: soar-panel-linux-${{ matrix.arch }}
          path: dist/soar-panel-*.tar.gz*
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always() && inputs.target == 'panel'
        with:
          name: panel-screenshots-${{ matrix.arch }}
          path: ${{ runner.temp }}/panel-screenshots/*.png
          if-no-files-found: ignore
      - name: Build the standalone server bundle
        if: inputs.target == 'standalone'
        env:
          RELEASE_VERSION: ${{ needs.plan.outputs.version }}
        run: |
          python3 scripts/build_bundle.py
          bash "dist/soar-server-setup-$RELEASE_VERSION-linux-amd64/install.sh" --check-bundle
      - uses: actions/upload-artifact@v4
        if: inputs.target == 'standalone'
        with:
          name: soar-server-linux-amd64
          path: |
            dist/soar-server-setup-*.tar.gz
            dist/soar-server-setup-*.sha256
          if-no-files-found: error
  release:
    needs: [plan, verify]
    if: needs.plan.outputs.build == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          pattern: ${{ inputs.target == 'panel' && 'soar-panel-linux-*' || 'soar-server-linux-*' }}
          merge-multiple: true
          path: release-artifacts
      - name: Publish the artifacts verified in this run
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TARGET: ${{ inputs.target }}
        run: python3 scripts/publish_release.py --artifacts release-artifacts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-verification
          path: release-verification.json
          if-no-files-found: ignore
