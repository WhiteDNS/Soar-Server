name: Verify management panel
on:
  pull_request:
  push:
    branches: [main, feature/soar-panel, feature/subscriptions-i18n]
    tags: ['panel-v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            arch: amd64
          - os: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Check release version consistency
        run: |
          python3 scripts/build_panel_bundle.py --print-version
          python3 -m unittest discover -s tests -p 'panel_release_test.py'
      - name: Check out the exact Cotten engine source
        uses: actions/checkout@v4
        with:
          repository: WhiteDNS/CottenDNS
          ref: 48b52018a0c261bccefaf20ad65f5f615ba823ea
          path: .engine-source/CottenDNS
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.1'
          cache-dependency-path: go.sum
      - name: Prepare the verified patched engine workspace
        run: |
          GOWORK=off go mod download
          python3 scripts/prepare_panel_engines.py --workspace .engine-source/patched.go.work
          echo "GOWORK=$GITHUB_WORKSPACE/.engine-source/patched.go.work" >> "$GITHUB_ENV"
      - name: Verify the release binaries
        run: go build -mod=readonly ./cmd/soar-panel ./cmd/soar-panel-ops ./cmd/soar-check
      - name: Build the pinned native Cotten test client
        run: |
          COTTEN_SOURCE=$(go list -m -f '{{.Dir}}' cottendns-go)
          (cd "$COTTEN_SOURCE" && go build -mod=readonly -o "$RUNNER_TEMP/cotten-client" ./cmd/client)
          echo "PANEL_COTTEN_CLIENT=$RUNNER_TEMP/cotten-client" >> "$GITHUB_ENV"
      - name: Verify MasterDNS startup and settings restart races
        run: go test -race ./internal/panel -run 'TestMasterDNS|TestSettingsSaveRestarts' -count=3 -timeout 180s
      - name: Verify modules and behavior
        run: |
          go mod verify
          go test ./... -count=1 -timeout 180s
          go test -race ./internal/panel ./internal/panelops -count=1 -timeout 900s
          go vet ./...
          (cd .engine-source/CottenDNS && go test ./... -count=1 -timeout 240s && go vet ./...)
          (cd .engine-source/MasterDnsVPN && go test ./... -count=1 -timeout 240s && go test -race ./internal/udpserver -run TestEmbedded -count=1 -timeout 60s && go vet ./...)
          bash tests/installer_test.sh
          bash tests/panel_installer_test.sh
          bash tests/panel_bootstrap_test.sh
      - name: Build offline Linux bundle
        id: bundle
        run: |
          version=$(python3 scripts/build_panel_bundle.py --print-version)
          python3 scripts/build_panel_bundle.py --arch "${{ matrix.arch }}"
          directory="dist/soar-panel-$version-linux-${{ matrix.arch }}"
          bash "$directory/panel-install.sh" --check-bundle
          python3 tests/panel_bundle_test.py --bundle "$directory" --version "$version"
          echo "directory=$directory" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install isolated browser test tools
        run: |
          npm install --prefix "$RUNNER_TEMP/panel-tools" --ignore-scripts --no-audit --no-fund playwright@1.58.2
          node "$RUNNER_TEMP/panel-tools/node_modules/playwright/cli.js" install --with-deps chromium
      - name: Test browser workflows and responsive layout
        env:
          PANEL_BINARY: ${{ github.workspace }}/${{ steps.bundle.outputs.directory }}/bin/linux-${{ matrix.arch }}/soar-panel
          PANEL_PLAYWRIGHT: ${{ runner.temp }}/panel-tools/node_modules/playwright
          PANEL_SCREENSHOTS: ${{ runner.temp }}/panel-screenshots
        run: |
          node tests/panel-ui.cjs
          node tests/panel-limits-ui.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: soar-panel-linux-${{ matrix.arch }}
          path: dist/soar-panel-*.tar.gz*
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: panel-screenshots-${{ matrix.arch }}
          path: ${{ runner.temp }}/panel-screenshots/*.png
          if-no-files-found: ignore
  release:
    if: startsWith(github.ref, 'refs/tags/panel-v')
    needs: verify
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    concurrency:
      group: panel-release-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: soar-panel-linux-*
          merge-multiple: true
          path: release-artifacts
      - name: Publish verified panel assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(python3 scripts/build_panel_bundle.py --print-version)
          assets=()
          for arch in amd64 arm64; do
            asset="soar-panel-$version-linux-$arch.tar.gz"
            mapfile -t archives < <(find release-artifacts -type f -name "$asset")
            test "${#archives[@]}" -eq 1
            archive="${archives[0]}"
            checksum="$archive.sha256"
            (cd "$(dirname "$archive")" && sha256sum --check "$asset.sha256")
            assets+=("$archive" "$checksum")
          done
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${assets[@]}"
          else
            gh release create "$GITHUB_REF_NAME" "${assets[@]}" --verify-tag \
              --title "WhiteDNS Panel $version" --notes-file "docs/RELEASE-panel-$version.md"
          fi
