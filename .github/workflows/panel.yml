name: Verify panel beta
on:
  pull_request:
  push:
    branches: [feature/soar-panel]
    tags: ['panel-v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.1'
          cache-dependency-path: go.sum
      - name: Verify modules and behavior
        run: |
          go mod verify
          go test ./... -count=1 -timeout 90s
          go test -race ./internal/panel ./internal/panelops -count=1 -timeout 120s
          go vet ./...
          bash tests/panel_installer_test.sh
          bash tests/panel_bootstrap_test.sh
      - name: Build offline Linux bundle
        run: |
          python3 scripts/build_panel_bundle.py
          bash dist/soar-panel-0.2.0-beta8-linux-amd64/panel-install.sh --check-bundle
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install isolated browser test tools
        run: |
          npm install --prefix "$RUNNER_TEMP/panel-tools" --ignore-scripts --no-audit --no-fund playwright@1.58.2
          node "$RUNNER_TEMP/panel-tools/node_modules/playwright/cli.js" install --with-deps chromium
      - name: Test browser workflows and responsive layout
        env:
          PANEL_BINARY: ${{ github.workspace }}/dist/soar-panel-0.2.0-beta8-linux-amd64/bin/linux-amd64/soar-panel
          PANEL_PLAYWRIGHT: ${{ runner.temp }}/panel-tools/node_modules/playwright
          PANEL_SCREENSHOTS: ${{ runner.temp }}/panel-screenshots
        run: node tests/panel-ui.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: soar-panel-beta-linux-amd64
          path: |
            dist/soar-panel-*.tar.gz*
            ${{ runner.temp }}/panel-screenshots/*.png
          if-no-files-found: error
